<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0d0c">
  <meta name="description" content="Interaktivna priprava na teoretični izpit iz optimizacije.">
  <title>OPT/LAB — izpitna priprava</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="oral.css">
</head>
<body>
  <a class="skip-link" href="#view">Preskoči na vsebino</a>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Glavna navigacija">
      <div class="brand" aria-label="OPT LAB">
        <span class="brand-mark">O/</span>
        <span><strong>OPT</strong><small>PRIPRAVA NA USTNI</small></span>
      </div>

      <label class="search-box" for="global-search">
        <span aria-hidden="true">⌕</span>
        <input id="global-search" type="search" placeholder="Išči po teoriji …" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="search-results" id="search-results" hidden></div>

      <nav class="main-nav" aria-label="Načini učenja">
        <a href="#/teorija" data-route="teorija"><span>≡</span> Vprašanja za ustni</a>
        <a href="#/vprasanje/lp" data-route="osnova"><span>↗</span> Začni z osnovami</a>
        <div class="nav-label">PREVERI ZNANJE</div>
        <a href="#/kartice" data-route="kartice"><span>◇</span> Kartice</a>
        <a href="#/kviz" data-route="kviz"><span>✓</span> Kviz</a>
        <a href="#/izpit" data-route="izpit"><span>✎</span> Izpit</a>
        <div class="nav-secondary">
          <div class="nav-label">ZA PODROBNEJŠO RAZLAGO</div>
          <a href="#/gradivo" data-route="gradivo"><span>⌑</span> Celotno gradivo</a>
          <a href="#/pregled-8h" data-route="pregled-8h"><span>◴</span> 8-urni pregled</a>
        </div>
      </nav>

      <div class="sidebar-bottom">
        <div class="progress-orbit" id="sidebar-progress" aria-label="Napredek pri teoriji">
          <svg viewBox="0 0 44 44" aria-hidden="true">
            <circle class="orbit-track" cx="22" cy="22" r="18"></circle>
            <circle class="orbit-value" cx="22" cy="22" r="18"></circle>
          </svg>
          <span>0%</span>
        </div>
        <div>
          <strong>Tvoj napredek</strong>
          <small id="progress-copy">0 od 27 odgovorov znaš</small>
        </div>
      </div>
    </aside>

    <div class="page-shell">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" type="button" aria-label="Odpri navigacijo" aria-expanded="false">☰</button>
        <div class="breadcrumb" id="breadcrumb">Optimizacija <span>/</span> Pregled</div>
        <div class="topbar-actions">
          <button class="quiet-button" id="quick-random" type="button" title="Naključna kartica">Naključni izziv</button>
          <span class="status-dot"><i></i> lokalno shranjeno</span>
        </div>
      </header>

      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>Za interaktivne kartice, kviz in izpit mora biti JavaScript omogočen.</noscript>
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/katex/contrib/auto-render.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="enhancements.js" defer></script>
  <script src="enhancements-lp.js" defer></script>
  <script src="enhancements-graphs.js" defer></script>
  <script src="enhancements-polish.js" defer></script>
  <script src="review-lp-data.js" defer></script>
  <script src="review-network-data.js" defer></script>
  <script src="review-graph-data.js" defer></script>
  <script src="review-visuals-lp.js" defer></script>
  <script src="review-visuals-network.js" defer></script>
  <script src="review-visuals-graph.js" defer></script>
  <script src="review-8h.js" defer></script>
  <script src="enhancements-practice.js" defer></script>
  <script src="oral-data.js" defer></script>
  <script src="oral-visuals.js" defer></script>
  <script src="oral.js" defer></script>
  <script src="app.js" defer></script>

</html>
